name: Deploy GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: divmora/.github/.github/workflows/pages-deploy.yml@main
    with:
      artifact-path: './ui/dist'
      build-command: 'pnpm run build:pages'
      node-version: '24'
      package-manager: 'pnpm'
