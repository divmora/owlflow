name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="owlflow"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME="owlflow.exe"
          fi
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "${BINARY_NAME}" ./cmd/server/main.go

      - name: Package Archive
        run: |
          ARCHIVE_NAME="owlflow_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "dist/${ARCHIVE_NAME}"
          
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp owlflow.exe "dist/${ARCHIVE_NAME}/"
            cp README.md "dist/${ARCHIVE_NAME}/" 2>/dev/null || true
            cd dist
            zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
            cd ..
          else
            cp owlflow "dist/${ARCHIVE_NAME}/"
            cp README.md "dist/${ARCHIVE_NAME}/" 2>/dev/null || true
            cd dist
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            cd ..
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz dist/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
