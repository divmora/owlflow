apiVersion: apps/v1
kind: Deployment
metadata:
  name: owlflow
  namespace: owlflow
  labels:
    app.kubernetes.io/name: owlflow
    app.kubernetes.io/component: engine
    app.kubernetes.io/part-of: owlflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: owlflow
      app.kubernetes.io/component: engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owlflow
        app.kubernetes.io/component: engine
        app.kubernetes.io/part-of: owlflow
      annotations:
        prometheus.io/scrape: "false"
        prometheus.io/port: "8080"
        prometheus.io/path: "/healthz"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: owlflow
          image: ghcr.io/divmora/owlflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: WORKFLOW_CONFIG_PATH
              value: "/app/configs/workflows"
          envFrom:
            - secretRef:
                name: owlflow-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: workflows-volume
              mountPath: /app/configs/workflows
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: workflows-volume
          configMap:
            name: owlflow-workflows
        - name: tmp-volume
          emptyDir: {}
