apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: owlflow
  namespace: owlflow
  labels:
    app.kubernetes.io/name: owlflow
    app.kubernetes.io/component: engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: owlflow
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
