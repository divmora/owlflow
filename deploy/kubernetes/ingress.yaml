apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: owlflow
  namespace: owlflow
  labels:
    app.kubernetes.io/name: owlflow
    app.kubernetes.io/component: engine
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - owlflow.example.com
      secretName: owlflow-tls-cert
  rules:
    - host: owlflow.example.com
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: owlflow
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: owlflow
                port:
                  number: 8080
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: owlflow
                port:
                  number: 8080
