name: Mirror Lambda Adapter to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag of aws-lambda-adapter to mirror (e.g. 0.8.4)'
        required: true
        default: '0.8.4'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Mirror Lambda Adapter
    runs-on: ubuntu-latest
    steps:
      - name: Log into GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Copy multi-arch image to GHCR
        run: |
          TAG="${{ inputs.tag || '0.8.4' }}"
          echo "Mirroring public.ecr.aws/awsguru/aws-lambda-adapter:${TAG} to ghcr.io/${{ github.repository_owner }}/owlflow-lambda-adapter:${TAG}..."
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/owlflow-lambda-adapter:${TAG}" \
            "public.ecr.aws/awsguru/aws-lambda-adapter:${TAG}"
